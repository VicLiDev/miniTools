# ==============================================================
# demo_linux.ini —— Linux 平台参考模板 (gcc 工具链)
#
# 用途: 展示 rkBuildKer_v2.sh 的 ini 全部字段。新增平台时,
#   把本文件复制一份改名即可, 无需改主脚本。
#
# 语法:
#   - [section] 为节名。每个平台一份 [platform]/[toolchain]/[build]/
#     [kmod]/[flash], [config_patch] 可选。
#   - `key = value` 形式; `#` 开头为注释; 空行忽略。
#   - 值里的 `~` 会自动展开为 $HOME。
#
# 本 demo 与 demo_android.ini / demo_android16_rust.ini 的差异:
#   - 工具链: gcc (无 LLVM), 无 path_android_lt6, 无 env
#   - config: 不含 ${android_config} 占位符, 无 android_config
# ==============================================================

[platform]
# name: 平台显示名(选择菜单显示, 也可被 --ini 匹配)
name = demo_linux
# arch: 内核架构, 只能填 arm 或 arm64
#   32 位平台(如 1106/1109/1126B_ipc)填 arm, 工具链与 CROSS_COMPILE 也换 arm
arch = arm64

[toolchain]
# path: 工具链 bin 目录, 会 prepend 到 PATH 最前面。
#   - 多个候选用 `|` 分隔, 取第一个"存在"的目录(都不存在则用第一个)。
#   - 支持 `~` 前缀。
path = ~/Projects/prebuilts/toolchains/aarch64/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin
# path_android_lt6: (可选, 仅 android/fpga 平台有意义)
#   内核 VERSION < 6 时改用此工具链。Linux 平台省略。
# env: (可选) 额外环境变量, KEY=value 用 `|` 分隔, 值支持 `~`。
#   Linux 平台一般不需要(除非要设 KBUILD_* 之类的变量)。
# make: 编译命令模板(必填)。最终会展开为:
#   make <make 模板> ARCH=<arch> <config 或 target> ...
make = make CROSS_COMPILE=aarch64-none-linux-gnu-

[build]
# mode: 构建方式
#   - build_kernel : 整编内核(defconfig + make target)
#   - build_kmod   : 只编某个模块(M= 方式)
#   - auto(默认)   : 检测 mpp Makefile 是否有 obj-m, 自动决定
#     (有 obj-m 且未指定时, 命令行 --kernel/--mod 可强制覆盖)
mode = auto
# config: defconfig 列表, 空格分隔(会依次作为 make 目标生成 .config)。
#   Linux 平台直接写死, 不含 android 占位符。
config = rockchip_linux_defconfig
# target: make 目标(可多个, 空格分隔)。常见附加项:
#   - BOOT_IMG=xxx.img : 把 Image 打包成 xxx.img(rockchip 脚本生成)
#   - BOOT_ITS=xxx.its : 用 ITS 描述打包(老平台 1126B 用)
target = rk3588-evb1-lp4-v10.img BOOT_IMG=../rk_kernel_boot/boot_demo.img
# android_config: (可选, 仅 android 平台) Linux 平台省略。

[kmod]
# dir: mode=build_kmod 时模块所在目录(相对内核根)。
#   不填默认 drivers/video/rockchip/mpp
dir = drivers/video/rockchip/mpp
# ko: 生成/推送的 .ko 文件名。不填默认 rk_vcodec.ko
ko = rk_vcodec.ko

[flash]
# method: 编译后动作
#   - rkut : 拷贝 boot_img 到 ~/test 并用 rkut.sh 烧录(整编内核用)
#   - adb  : 用 adbs 推送 ko 到设备并 rmmod+insmod(单编模块用)
#   - none : 不做任何动作
#   - auto(默认): 按 mode 推断(build_kernel→rkut, build_kmod→adb)
method = auto
# boot_img: method=rkut 时烧录的镜像(相对内核根)。默认 boot.img
boot_img = boot.img
# reset: rkut 烧录后是否复位设备(true/false)。默认 true
reset = true
# push_dir: method=adb 时 ko 推送目录。默认 /data
push_dir = /data

# [config_patch] 可选: 在 defconfig 之后、正式 make 之前, 对 .config
#   执行 sed 修改, 按数字键的顺序执行。
[config_patch]
1 = s/# CONFIG_EXFAT_FS is not set/CONFIG_EXFAT_FS=y/g
2 = s/# CONFIG_MMC_SDHCI is not set/CONFIG_MMC_SDHCI=y/g
