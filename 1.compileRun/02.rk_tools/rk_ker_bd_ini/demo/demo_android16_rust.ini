# ==============================================================
# demo_android16_rust.ini —— Android 16 / kernel 6.12 Rust 参考模板
#
# 适用: 需要 Rust-for-Linux 的平台(Android 16, kernel 6.6/6.12)。
# 与 demo_android.ini 的差异(重点看这几处):
#   - path 用 `|` 分隔多个目录(clang + rust + bindgen + kernel-build-tools),
#     所有存在的都会加入 PATH(顺序保留)
#   - 多一个 env: Rust 构建必需的环境变量
#   - config 里显式写 android-16.config(不再 auto 探测)
# ==============================================================

[platform]
name = demo_android16_rust
arch = arm64

[toolchain]
# path: 多目录用 `|` 分隔, 全部存在的都 prepend 到 PATH(顺序保留)。
#   Rust-for-Linux 编译需要 4 类工具:
#   - clang              : 内核 C 编译(clang-r574158 是 Android16 版本)
#   - rust/1.88.0/bin    : rustc/cargo
#   - clang-tools/bin    : bindgen(把 C 头转成 Rust 绑定)
#   - kernel-build-tools : avbtool/depmod/dtc 等内核构建辅助工具
path = ~/Projects/sdk_android_16/prebuilts/clang/host/linux-x86/clang-r574158/bin|~/Projects/sdk_android_16/prebuilts/rust/linux-x86/1.88.0/bin|~/Projects/sdk_android_16/prebuilts/clang-tools/linux-x86/bin|~/Projects/sdk_android_16/prebuilts/kernel-build-tools/linux-x86/bin
# env: Rust 构建必需的环境变量(KEY=value 用 `|` 分隔, 值支持 `~`):
#   - RUSTC       : rustc 路径
#   - BINDGEN     : bindgen 路径(在 clang-tools/bin 下)
#   - LIBCLANG_PATH : libclang.so 所在目录(注意是 clang 的 lib 目录,
#                     不是 clang-tools 的)
#   - KBUILD_GENDWARFKSYMS_STABLE : 固定写 1
env = RUSTC=~/Projects/sdk_android_16/prebuilts/rust/linux-x86/1.88.0/bin/rustc|BINDGEN=~/Projects/sdk_android_16/prebuilts/clang-tools/linux-x86/bin/bindgen|LIBCLANG_PATH=~/Projects/sdk_android_16/prebuilts/clang/host/linux-x86/clang-r574158/lib|KBUILD_GENDWARFKSYMS_STABLE=1
# make: 同 android(LLVM=1 LLVM_IAS=1)。
make = make CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

[build]
mode = auto
# config: 6.12 直接写死 android-16.config(不再用 ${android_config} auto)。
config = rockchip_defconfig android-16.config rk3588.config
# target: 同 android, 可带 BOOT_IMG。
target = BOOT_IMG=../rk_kernel_boot/boot_3588_android16.img rk3588-evb1-lp4-v10.img
# android_config: 已在 config 里显式写出, 这里省略。

[kmod]
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
method = auto
boot_img = boot.img
reset = true
push_dir = /data
