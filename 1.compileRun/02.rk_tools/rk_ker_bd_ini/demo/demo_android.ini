# ==============================================================
# demo_android.ini —— Android 平台参考模板 (clang, 无 Rust)
#
# 适用: Android <= 14 / kernel <= 6.1 的 android/fpga 平台。
# 与 demo_linux.ini 的差异(重点看这几处):
#   - 工具链用 clang, make 带 LLVM=1 LLVM_IAS=1
#   - 多一个 path_android_lt6 (内核 VERSION<6 时用旧 clang)
#   - config 用 ${android_config} 占位符 + android_config=auto 探测
# ==============================================================

[platform]
name = demo_android
arch = arm64

[toolchain]
# path: clang 工具链 bin 目录。多个候选用 `|` 分隔(取第一个存在的)。
path = ~/Projects/prebuilts/toolchains/linux-x86_rk/clang-r487747c/bin
# path_android_lt6: (可选) 内核 VERSION<6(如 5.10)时改用旧版 clang。
#   VERSION>=6 时走上面的 path。
path_android_lt6 = ~/Projects/prebuilts/toolchains/aarch64/clang-r416183b/bin
# make: android 用 clang 编译, 需要 LLVM=1 LLVM_IAS=1(集成汇编器)。
#   fpga 平台额外加 LT0=none(见本文件末尾注释)。
make = make CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

[build]
mode = auto
# config: android 平台用 ${android_config} 占位符, 运行时会被替换成
#   android_config 解析出的值(如 android-14.config)。
#   顺序即 make 目标顺序, 芯片片段(rk3576.config)跟在后面叠加。
config = rockchip_defconfig ${android_config} rk3576.config
# target: 同 linux, 可带 BOOT_IMG。
target = BOOT_IMG=../rk_kernel_boot/boot_demo_android.img rk3576-evb1-v10.img
# android_config: 解析 android config
#   - auto          : 自动找内核树里的 android-*.config, 取版本号最大的
#   - android-12.config 等字面量 : 写死
android_config = auto

[kmod]
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
method = auto
boot_img = boot.img
reset = true
push_dir = /data

# config_patch 示例: android 平台常见补丁(打开 DEVMEM)。
[config_patch]
1 = s/# CONFIG_DEVMEM is not set/CONFIG_DEVMEM=y/g

# --------------------------------------------------------------
# 附: fpga 平台变体(如 3576_fpga / 1126B_linux_fpga)
#   只需改 make 模板加 LT0=none, config 用 rockchip_defconfig
#   (不带 android 占位符), target 用 *-fpga.img。其余同本 demo。
#   make = make CROSS_COMPILE=aarch64-linux-gnu- LT0=none LLVM=1 LLVM_IAS=1
# --------------------------------------------------------------
