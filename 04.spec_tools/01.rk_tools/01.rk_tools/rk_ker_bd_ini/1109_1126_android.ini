# 1109/1126_ANDROID kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = 1109/1126_android
arch = arm

[toolchain]
path = ~/Projects/prebuilts/toolchains/arm/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf/bin
make = make CROSS_COMPILE=arm-linux-gnueabihf-

[build]
# build_kernel / build_kmod / auto(检测 mpp Makefile 是否 obj-m)
mode = auto
config = rv1126_defconfig
target = rv1126-evb-ddr3-v13.img
# auto: 自动检测 android-*.config, 也可直接写如 android-12.config
android_config = auto

[kmod]
# mode=build_kmod 时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
