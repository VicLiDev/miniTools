# 3576_FPGA kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = 3576_fpga
arch = arm64

[toolchain]
path = ~/Projects/prebuilts/toolchains/linux-x86_rk/clang-r487747c/bin
# 非 linux 平台(android/fpga)且内核 VERSION < 6 时使用 (可选)
path_android_lt6 = ~/Projects/prebuilts/toolchains/aarch64/clang-r416183b/bin
make = make CROSS_COMPILE=aarch64-linux-gnu- LT0=none LLVM=1 LLVM_IAS=1

[build]
# build_kernel / build_kmod / auto(检测 mpp Makefile 是否 obj-m)
mode = auto
config = rockchip_defconfig
target = rk3576-fpga.img

[kmod]
# mode=build_kmod 时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data

[config_patch]
# 可选: 编译前对 .config 的 sed 修改, 按键序执行
1 = s/# CONFIG_ROCKCHIP_MPP_RKVDEC3 is not set/CONFIG_ROCKCHIP_MPP_RKVDEC3=y/g
