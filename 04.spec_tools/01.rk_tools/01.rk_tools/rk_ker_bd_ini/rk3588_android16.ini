# RK3588_ANDROID16 kernel build config (Rust-for-Linux 示例)
# Android 16 / kernel 6.12 如需启用 Rust, 需额外 rust/bindgen 工具链与环境变量。
# 工具链、rust、bindgen 位于 sdk_android_16 的 prebuilts 下。
# 前置条件(缺一不可, 缺失时 setup_toolchain 的 toolchain check 会直接报错):
#   1) ~/Projects/sdk_android_16/prebuilts 存在(可软链到 SDK: Android16/prebuilts)
#   2) 内核树里有 android-16.config: kernel/configs/ 或 arch/arm64/configs/
#      (6.1/6.12 的 make %.config 规则两处都会找)
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = rk3588_android16
arch = arm64

[toolchain]
# 多目录依次加入 PATH: clang 在前, 再 rust / bindgen / kernel-build-tools
path = ~/Projects/sdk_android_16/prebuilts/clang/host/linux-x86/clang-r574158/bin|~/Projects/sdk_android_16/prebuilts/rust/linux-x86/1.83.0/bin|~/Projects/sdk_android_16/prebuilts/clang-tools/linux-x86/bin|~/Projects/sdk_android_16/prebuilts/kernel-build-tools/linux-x86/bin
# Rust-for-Linux 环境变量 (| 分隔 KEY=value)
# LD_LIBRARY_PATH/HOSTCFLAGS/HOSTLDFLAGS 用于 kernel-build-tools 里的 host 工具
env = RUSTC=~/Projects/sdk_android_16/prebuilts/rust/linux-x86/1.83.0/bin/rustc|BINDGEN=~/Projects/sdk_android_16/prebuilts/clang-tools/linux-x86/bin/bindgen|LIBCLANG_PATH=~/Projects/sdk_android_16/prebuilts/clang/host/linux-x86/clang-r574158/lib|KBUILD_GENDWARFKSYMS_STABLE=1|LD_LIBRARY_PATH=~/Projects/sdk_android_16/prebuilts/kernel-build-tools/linux-x86/lib64|HOSTCFLAGS=-I~/Projects/sdk_android_16/prebuilts/kernel-build-tools/linux-x86/include|HOSTLDFLAGS=-L~/Projects/sdk_android_16/prebuilts/kernel-build-tools/linux-x86/lib64
cc = clang
cross = aarch64-linux-gnu-
extra = LLVM=1 LLVM_IAS=1

[build]
config = rockchip_defconfig android-16.config rk3588.config
target = BOOT_IMG=../rk_kernel_boot/boot_3588_android16.img rk3588-evb1-lp4-v10.img

[kmod]
# 单编模块时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
