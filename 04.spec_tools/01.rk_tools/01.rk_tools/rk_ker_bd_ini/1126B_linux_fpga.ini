# 1126B_LINUX_FPGA kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = 1126B_linux_fpga
arch = arm64

[toolchain]
path = ~/Projects/prebuilts/toolchains/aarch64/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin
make = make CROSS_COMPILE=aarch64-none-linux-gnu-

[build]
# build_kernel / build_kmod / auto(检测 mpp Makefile 是否 obj-m)
mode = auto
config = rv1126b_defconfig
target = rv1126b-fpga.img

[kmod]
# mode=build_kmod 时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data

[config_patch]
# 可选: 编译前对 .config 的 sed 修改, 按键序执行
1 = s/# CONFIG_EXFAT_FS is not set/CONFIG_EXFAT_FS=y/g
2 = s/# CONFIG_MMC_SDHCI is not set/CONFIG_MMC_SDHCI=y/g
3 = s/# CONFIG_CRC_ITU_T is not set/CONFIG_CRC_ITU_T=y/g
4 = s/# CONFIG_CRC7 is not set/CONFIG_CRC7=y/g
