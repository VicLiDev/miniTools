# RV1106_LINUX kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = rv1106_linux
arch = arm

[toolchain]
path = ~/Projects/prebuilts/toolchains/arm/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf/bin
cc = gcc
cross = arm-linux-gnueabihf-

[build]
config = rv1106_defconfig
target = rv1106g-evb1-v11.img

[kmod]
# 单编模块时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
