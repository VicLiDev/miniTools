# RK1860_LINUX kernel build config
# 适用于独立内核源码树(如 ~/Projects/kernel), 只编译内核, 不做 SDK 打包
# 用法: cd <kernel_dir> && rkBuildKer.sh --ini rk1860_linux --kernel

[platform]
name = rk1860_linux
# RK1860 是 RISCV64, 内核 ARCH 使用 riscv
arch = riscv

[toolchain]
# Xuantie-900 RISCV64 musl 工具链
path = ~/Projects/prebuilts/toolchains/riscv_1860sdk/riscv64/Xuantie-900-gcc-linux-6.6.36-musl64-x86_64-V3.3.0/bin
make = make CROSS_COMPILE=riscv64-unknown-linux-musl-

[build]
# 每次编译前按 rk1860_defconfig 重新生成 .config;
# 需要长期保留的裁剪项写进 [config_patch]
config = rk1860_defconfig
# 编 RK1860 EVB1 的 dtb + Image.lz4 + modules, 再调用 scripts/mkimg 打包 boot.img。
# BOOT_IMG 是 repack 用的 FIT 模板(不是输出路径), 产物在 <kernel_dir>/boot.img;
# 模板缺失时会退化成 Android bootimg, RK1860 无法启动。
target = BOOT_IMG=../rk_kernel_boot/boot_rk1860.img rk1860-evb1-v10-cp1.img

[kmod]
# 单编模块时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# build_kernel 后自动 rkut 烧录 boot.img (设备需处于 loader 模式),
# build_kmod 后自动 adb push + insmod; 只想编译可用 --dry 跳过烧录
method = auto
boot_img = boot.img
reset = true
push_dir = /data
