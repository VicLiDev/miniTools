# RK1860_LINUX kernel build config
# 适用于独立内核源码树(如 ~/Projects/kernel), 只编译内核, 不做 SDK 打包
# 用法: cd <kernel_dir> && rkBuildKer.sh --ini rk1860_linux --kernel

[platform]
name = rk1860_linux
# RK1860 是 RISCV64, 内核 ARCH 使用 riscv
arch = riscv

[toolchain]
# Xuantie-900 RISCV64 musl 工具链
path = ~/Projects/prebuilts/toolchains/riscv_1860sdk/riscv64/Xuantie-900-gcc-linux-6.6.36-musl64-x86_64-V3.3.0/bin
make = make CROSS_COMPILE=riscv64-unknown-linux-musl-

[build]
# 每次编译前按 rk1860_defconfig 重新生成 .config;
# 需要长期保留的裁剪项写进 [config_patch]
config = rk1860_defconfig
# 编 RK1860 EVB1 的 dtb + Image.lz4 + modules, 再调用 scripts/mkimg 打包 boot.img。
# BOOT_IMG 是 repack 用的 FIT 模板(不是输出路径), 产物在 <kernel_dir>/boot.img;
# 模板缺失时会退化成 Android bootimg, RK1860 无法启动。
target = BOOT_IMG=../rk_kernel_boot/boot_rk1860.img rk1860-evb1-v10-cp1.img

[config_patch]
# 两种写法都支持, 按数值键序执行:
#   CONFIG_FOO=y|m|n   声明式, 直接追加进 .config(不依赖 .config 当前文本)
#   <sed 表达式>       老写法, 要求 .config 里确实存在可匹配的行
# 注意: 补丁只是改写 .config, 之后直接进 make, kconfig 会就新出现的符号
# (输出里带 "(NEW)") 逐项提问。这时一路回车即可: 方括号里就是回车采纳的
# 默认值, 也正是这里期望的结果(MODULES/MODULE_UNLOAD 为 y, MODVERSIONS、
# MODULE_SIG 为 n, TRIM_UNUSED_KSYMS 为 n——开了会裁掉 ko 依赖的导出符号,
# STRICT_MODULE_RWX 为 y)。若不想逐项回车, 可先手动执行一次
#   make <ARCH/CROSS_COMPILE 同 [toolchain]> olddefconfig
# 关掉 DRM ioctl 权限检查(含 render 节点), rk1860_defconfig 默认没开;
# 否则 MPP 在 /dev/dri/renderD128 上 CREATE_DUMB 会 EACCES, 导致 mpp_init 失败。
1 = s/# CONFIG_DRM_IGNORE_IOTCL_PERMIT is not set/CONFIG_DRM_IGNORE_IOTCL_PERMIT=y/
# 启用 system dma-heap, 让 MPP 优先走 /dev/dma_heap/system (DMA_HEAP 优先于 DRM)。
# CMA_SIZE_MBYTES=0 且无 CMA reserved-memory, 只有 system heap 能建出节点。
2 = s/# CONFIG_DMABUF_HEAPS_SYSTEM is not set/CONFIG_DMABUF_HEAPS_SYSTEM=y/
# rk1860_defconfig 不含 CONFIG_MODULES, 新版 kernel/module/Kconfig 里 MODULES
# 默认是 n, 不补这条每次重新 defconfig 都会关掉模块, 导致外部 ko 编不了。
3 = s/# CONFIG_MODULES is not set/CONFIG_MODULES=y/
# MODULES=n 时 MODULE_UNLOAD 不可见, .config 里根本没有它的行, sed 匹配不到,
# 所以这条只能用声明式写法。它默认 n, 关掉会丢 __symbol_put() 声明, 且无法 rmmod。
4 = CONFIG_MODULE_UNLOAD=y

[kmod]
# 单编模块时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# build_kernel 后自动 rkut 烧录 boot.img (设备需处于 loader 模式),
# build_kmod 后自动 adb push + insmod; 只想编译可用 --dry 跳过烧录
method = auto
boot_img = boot.img
reset = true
push_dir = /data
