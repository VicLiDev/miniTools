# 1126B_IPC_ARM kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = 1126B_ipc_arm
arch = arm

[toolchain]
path = ~/Projects/prebuilts/toolchains/arm/arm-rockchip1240-linux-gnueabihf/bin
make = make CROSS_COMPILE=arm-rockchip1240-linux-gnueabihf-

[build]
# build_kernel / build_kmod / auto(检测 mpp Makefile 是否 obj-m)
mode = auto
config = rv1126b_defconfig rv1126b-evb.config
target = rv1126b-evb1-v10.img BOOT_ITS=boot.its

[kmod]
# mode=build_kmod 时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
