# 3566_ANDROID kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = 3566_android
arch = arm64

[toolchain]
path = ~/Projects/prebuilts/toolchains/linux-x86_rk/clang-r487747c/bin
# 非 linux 平台(android/fpga)且内核 VERSION < 6 时使用 (可选)
path_android_lt6 = ~/Projects/prebuilts/toolchains/aarch64/clang-r416183b/bin
make = make CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

[build]
# build_kernel / build_kmod / auto(检测 mpp Makefile 是否 obj-m)
mode = auto
config = rockchip_defconfig rk356x.config ${android_config}
target = rk3566-evb1-ddr4-v10.img BOOT_IMG=../rk_kernel_boot/boot1.img
# auto: 自动检测 android-*.config, 也可直接写如 android-12.config
android_config = auto

[kmod]
# mode=build_kmod 时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
