# RK3288_ANDROID kernel build config
# 每个平台一份 ini, 字段含义见 README.md

[platform]
name = rk3288_android
arch = arm

[toolchain]
path = ~/Projects/prebuilts/toolchains/arm/gcc-arm-8.3-2019.03-x86_64-arm-linux-gnueabihf/bin
cc = gcc
cross = arm-linux-gnueabihf-

[build]
config = rockchip_defconfig
target = rk3288-evb-android-rk808-edp.img
# auto: 自动检测 android-*.config, 也可直接写如 android-12.config
android_config = auto

[kmod]
# 单编模块时使用
dir = drivers/video/rockchip/mpp
ko = rk_vcodec.ko

[flash]
# 编译完成后的动作: rkut(烧录) / adb(insmod) / none
# 默认: build_kernel->rkut, build_kmod->adb
method = auto
boot_img = boot.img
reset = true
push_dir = /data
